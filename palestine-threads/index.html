function room(){return `<section class="hero"><div class="copy"><div class="eyebrow">✦ &nbsp; الرياضيات تحكي حكاية فلسطين</div><h1>غرفة الجدّة<br>زيتونة</h1><p>«تعالَ يا حبيبي. لهذا الخيط لون البرتقال… أتخَمِّن إلى أيّ مدينة سيأخذنا؟»</p><div class="actions">${btn('حرّك النول ✧',"weave()", 'primary')}${btn('▷ اسمع الجدّة','playRoom()')}</div></div><div class="visual"><img src="${ROOM}" alt="الجدة زيتونة أمام نول خشبي في غرفة حجرية"><span class="tag">مشهد فني تخيّلي</span></div></section><div class="sectionhead"><h2>خيوط الرحلة</h2><label>صفي <select onchange="setGrade(this.value)">${[4,5,6].map((g,i)=>`<option value="${g}" ${g===grade?'selected':''}>${['الرابع','الخامس','السادس'][i]}</option>`).join('')}</select></label></div><div class="cards">${card('الخريطة وآلة الزمن','اكتشف مدن فلسطين عبر السنين',atlasArt(),'atlas')}${card('يافا سنة ١٩٤٥','تجوّل من السوق إلى الميناء',town(0),'city')}${card('نسيج فلسطين الحي','شاهد ما نسجته باكتشافاتك',embroidery(0),'tree')}</div>`}
function weave(){visit('نول الجدّة');modal(`<h2>النول السحري</h2><svg viewBox="0 0 400 245" style="width:100%;height:230px;background:#284c40"><defs><pattern id="warp" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#db9e5c"/><path d="M0 2h7M3 0v7" stroke="#ffe1a5" stroke-width="1.3"/></pattern><clipPath id="woven"><rect width="400" height="470"><animate attributeName="y" from="470" to="0" dur="1.5s" fill="freeze"/></rect></clipPath></defs><g transform="translate(105 0) scale(.54)"><path d="${path}" fill="#52725d"/><path d="${path}" clip-path="url(#woven)" fill="url(#warp)"/></g></svg><p>نسجنا هيئة فلسطين. خذ خيط يافا إلى آلة الزمن.</p>${btn('افتح آلة الزمن',"dialog.close();go('atlas')",'dark')}`)}

function mapDoc(){modal(`<h2>وثيقة أرشيفية · ١٩٤٥</h2><img src="${MAP}" alt="نسخة مصوّرة لخريطة مسح فلسطين"><p>خريطة فلسطين، مسح سنة ١٩٤٥ بحسب فهرس مجموعة ماتسون. افتح النسخة الأصلية لتكبير التفاصيل.</p><a target="_blank" rel="noopener" href="https://www.loc.gov/pictures/resource/matpc.12336/">سجلّ مكتبة الكونغرس ↗</a>`)}
const stops=['سوق البرتقال','ساحة الساعة','ميناء يافا','بيت في يافا'];const missions=['تجهيز السلال','قسمة المحصول','تماثل التطريز','سياج الساحة','بلاط البيت','صناديق الميناء'];const atStop=[[0,1],[3],[5],[2,4]];
function resetGame(){count=0;marks=new Set();feedback=''}
function walk(i){stop=i;task=atStop[i][0];resetGame();visit(stops[i]);render()}
function pickTask(i){task=i;resetGame();render()}
function params(){let g=grade-3,w=g+2,h=g+1;return [{q:`جهّز ${ar(g+2)} سلال، في كل سلة ٣ برتقالات. كم برتقالة تحتاج؟`,sol:(g+2)*3,unit:'برتقالات',hint:'اجمع ثلاث برتقالات لكل سلة.'},{q:`في السوق ${ar(6*(g+1))} برتقالة. ضع ثلثها في سلة الجارة.`,sol:2*(g+1),unit:'برتقالات',hint:'قسّم المحصول إلى ثلاث مجموعات متساوية.'},{q:'طرّز النصف الأيسر ليطابق النصف الأيمن عند طيّه حول الخط الأوسط.',sol:0,unit:'غرز',hint:'الغُرزة القريبة من المحور تقابلها غرزة قريبة منه.'},{q:`طول الساحة ${ar(w)} أمتار وعرضها ${ar(h)} أمتار. كم مترًا من الحبل يحيط بها؟`,sol:2*(w+h),unit:'أمتار',hint:'تتبّع الأضلاع الأربعة واجمع أطوالها.'},{q:`أرض مستطيلة طولها ${ar(w)} أمتار وعرضها ${ar(h)} أمتار. كم بلاطة مربّعة مساحتها متر مربع تغطيها؟`,sol:w*h,unit:'بلاطات',hint:'اضرب عدد الصفوف في عدد البلاطات في كل صف.'},{q:`في مخزن الميناء صندوق طوله ${ar(w)} وحدات وعرضه وحدتان وارتفاعه وحدتان. كم مكعب وحدة يملؤه؟`,sol:w*4,unit:'مكعبات',hint:'احسب مكعبات طبقة واحدة، ثم ضاعفها للطبقتين.'}][task]}
const pattern=()=>grade===4?[0,3,4]:grade===5?[1,2,5]:[0,2,3,5];
function check(){let ok=task===2?marks.size===pattern().length&&pattern().every(i=>marks.has(i)):count===params().sol;if(ok){let id=grade+'-'+task;if(!known.includes(id))known.push(id);save();feedback='أحسنت! أُضيف خيط «'+missions[task]+'» إلى نسيجك.'}else feedback='جرّب مرة أخرى. '+params().hint;updateGame()}
function adjust(n){count=Math.max(0,Math.min(100,count+n));feedback='';updateGame()}
function stitch(i){if(marks.has(i))marks.delete(i);else marks.add(i);feedback='';updateGame()}
function game(){let m=params();let tiles=Array.from({length:3},(_,row)=>`<div style="display:grid;grid-template-columns:repeat(4,44px);gap:3px;direction:ltr">${[0,1].map(col=>{let i=row*2+1-col;return `<button aria-label="الصف ${ar(row+1)}، العمود ${ar(col+1)}" aria-pressed="${marks.has(i)}" onclick="stitch(${i})">${marks.has(i)?'◆':'·'}</button>`}).join('')}${[0,1].map(col=>`<span style="text-align:center;background:#eee4cf;border-left:${col?'0':'3px solid #9e573d'}">${pattern().includes(row*2+col)?'◆':'·'}</span>`).join('')}</div>`).join('');return `<h3>${missions[task]}</h3><p>${m.q}</p>${task===2?tiles:`<div class="actions">${btn('أضف ١','adjust(1)')}${btn('أضف ٥','adjust(5)')}${btn('أزل ١','adjust(-1)')}<strong aria-live="polite">${ar(count)} ${m.unit}</strong></div><div class="tiles" aria-hidden="true">${Array.from({length:count},()=>task<2?'🍊':task===3?'━':task===4?'▦':'▣').join(' ')}</div>`}<div class="choices">${btn('تحقّق من عملي','check()','dark')}</div><div role="status" class="answer">${feedback}</div>`}
function updateGame(){const a=document.activeElement,click=a?.getAttribute('onclick');document.getElementById('game').innerHTML=game();if(click)Array.from(document.querySelectorAll('#game button')).find(b=>b.getAttribute('onclick')===click)?.focus({preventScroll:true})}
function docPhoto(){modal(`<h2>صورة أرشيفية · تعبئة برتقال يافا</h2><img src="${PHOTO}" alt="عمّال يعبّئون برتقال يافا في صناديق"><p>من مجموعة ماتسون في مكتبة الكونغرس. تُعرض الصورة شاهدًا على تجارة البرتقال؛ سنة الجولة تخصّ المحاكاة.</p><a target="_blank" rel="noopener" href="https://www.loc.gov/resource/matpc.06245/">شاهد الصورة في الأرشيف ↗</a>`)}
function city(){return `<div class="sectionhead"><div class="small">خيط الساحل الفلسطيني</div></div><h1>يافا سنة ١٩٤٥</h1><div class="choices">${stops.map((s,i)=>btn(s,`walk(${i})`,i===stop?'active':'')).join('')}</div><div class="scene">${town(stop)}<span class="tag">إعادة تصوّر فنية · ${stops[stop]}</span></div><div class="grid"><section class="panel"><h2>${stops[stop]}</h2><p>${['رائحة البرتقال تملأ السوق. اختر سلة وساعد البائع في تجهيز طلبه.','وصلت إلى ساحة برج الساعة. مدّ حبلًا حول ساحة مستطيلة في لعبتنا.','عند الرصيف صناديق تنتظر التحميل. اكتشف كم مكعبًا يتّسع له الصندوق.','ادخل البيت وتأمّل التطريز والبلاط. أين ترى شكلًا يتكرّر؟'][stop]}</p><div class="actions">${btn('سر إلى '+stops[(stop+1)%4],`walk(${(stop+1)%4})`,'dark')}${btn('افتح صورة البرتقال','docPhoto()')}</div></section><section class="panel"><div class="choices">${atStop[stop].map(t=>btn(missions[t],`pickTask(${t})`,task===t?'active':'')).join('')}</div><div id="game">${game()}</div></section></div>`}
const facts=[['أيّ مدينة هي عاصمة فلسطين؟',['القدس','يافا','حيفا'],0,'القدس في المرتفعات الجبلية.'],['أيّ وصف يلائم صيف الساحل الفلسطيني؟',['ثلجي','حارّ وجافّ غالبًا','ممطر طوال الصيف'],1,'يسود الساحل مناخ البحر المتوسط.'],['أيّ مكان يقع في الغور؟',['صفد','أريحا','حيفا'],1,'تقع أريحا في منخفض غور الأردن.'],['ما اسم النشيد الوطني الفلسطيني؟',['موطني','فدائي','زهرة المدائن'],1,'فدائي هو النشيد الوطني الفلسطيني.'],['أيّ القرى من قضاء يافا؟',['بيت دجن','لفتا','بتّير'],0,'كانت بيت دجن من قرى قضاء يافا.'],['في أي سنة وقعت النكبة؟',['١٩٤٥','١٩٤٨','١٩٦٧'],1,'عام ١٩٤٨ تهجّر كثير من الفلسطينيين من بيوتهم.']];let qi=0,reply='';
function answer(i){let f=facts[qi];reply=i===f[2]?'أحسنت! '+f[3]:'تأمّل الخيارات وحاول ثانية.';if(i===f[2])visit(f[3]);render()}
function tree(){let leaves=known.length+visited.length;return `<div class="sectionhead"><h1>نسيج فلسطين الحي</h1></div><div class="grid"><section class="panel"><h2>خيوطي الرياضية</h2><div class="scene" style="height:100px">${embroidery(known.length)}</div><p>${known.length?'نسجت '+ar(known.length)+' خيوط.':'كل تحدٍّ تحلّه يضيف قطعة إلى نسيجك.'}</p><div class="tiles">${known.map(id=>{let [g,t]=id.split('-');return `<div class="tile" style="padding:8px">❖ ${missions[t]} · الصف ${ar(g)}</div>`}).join('')}</div>${btn('تابع جولتك في يافا',"go('city')",'dark')}</section><section class="panel"><h2>شجرة المعرفة</h2><svg viewBox="0 0 260 135" width="100%" height="135" aria-label="شجرة تنمو مع الاكتشافات"><path d="M130 130Q145 99 131 34M136 91l-44-34m46 23 40-37m-44 20-22-29" stroke="#846244" stroke-width="8" fill="none"/>${Array.from({length:Math.min(55,leaves+3)},(_,i)=>{let x=132+Math.cos(i*2.4)*Math.sqrt(i+1)*8,y=54+Math.sin(i*2.4)*Math.sqrt(i+1)*5;return `<ellipse cx="${x}" cy="${y}" rx="13" ry="6" fill="${i%2?'#53754b':'#7d9458'}" transform="rotate(${i%2?32:-30} ${x} ${y})"/>`}).join('')}</svg><p class="leaf">${visited.join(' · ')||'لمس النول وزيارة الأماكن ينمّيان أغصان شجرتك.'}</p></section></div><section class="panel"><h2>سؤال من الجدّة</h2><p>${facts[qi][0]}</p><div class="choices">${facts[qi][1].map((s,i)=>btn(s,`answer(${i})`)).join('')}</div><div role="status">${reply}</div>${btn('السؤال التالي',"qi=(qi+1)%facts.length;reply='';render()")}</section><small>${storageOK?'يُحفظ التقدّم في هذا المتصفح على هذا الجهاز.':'التقدّم متاح لهذه الجلسة فقط لأن التخزين المحلي غير متاح.'}</small>`}
function render(){page=pages.includes(location.hash.slice(1))?location.hash.slice(1):'room';if(page==='city')visit(stops[stop]);nav.innerHTML=pages.map((p,i)=>btn(labels[i],`go('${p}')`,p===page?'active':'')).join('');app.innerHTML=({room,atlas,city,tree})[page]()}render();
</script></body></html>
